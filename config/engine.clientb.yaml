# =====================================================================
# Client configuration — Client B  (synthetic demo data)
# Embodies axiom A2 (client-agnosticism): all client specificity lives here.
# Adding a client = duplicate this file + a KB container + a clientId.
# The engine NEVER changes.
# =====================================================================

client:
  id: clientb                   # clientId — basis of multi-tenant isolation
  displayName: "Client B"
  language: fr

# Knowledge source (private Blob container dedicated to the client)
knowledge:
  storageContainer: kb-clientb
  index: idx-clientb            # DEDICATED index (physical isolation, J2)
  # audio: deferred to Milestone 3 (Azure Speech)

# Isolation: only members of this Entra group can access the Client B index
access:
  entraGroup: "TODO-group-clientb-objectId"   # to fill in via the portal (Milestone 2)

# Retrieval parameters (axiom A3 — hierarchy)
retrieval:
  primaryCount: 1               # one primary record
  annexCount: 2                 # + annexes (<= 2) before the LLM
  hybrid: true                  # BM25 + vectors
  semanticReranker: true

# Determinism (axiom A1)
generation:
  model: gpt-4o
  temperature: 0
  seed: 42
