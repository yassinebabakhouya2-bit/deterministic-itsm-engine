# =====================================================================
# ITSM action module (Jalon 10) -- configuration of the agent review tab
# (app/itsm.py). Separate from engine.<client>.yaml on purpose: the ITSM
# module is not a RAG client (no index, no KB) and must not show up in the
# RAG client selector.
# =====================================================================

# Partition of the itsmtickets table (= clientCode of itsm/poll and itsm/propose)
clientCode: itsm-demo
table: itsmtickets
serviceNowInstance: dev374242

# Access (deny-by-default, same claim-based model as Jalon 5 / app/auth.py):
# the signed-in user must come from this tenant AND hold this Entra security group.
access:
  entraTenantId: "a50d938b-4d51-449f-bfb7-ddd94df25268"   # set by scripts/bootstrap-new-tenant.ps1
  entraGroup: "7e85cafe-bc3b-49e6-a5d4-1d8d80b9a508"   # KE-v9-itsm-agents, set by scripts/bootstrap-new-tenant.ps1

# Groups an agent may pick when validating a group_add proposal.
# Must stay in sync with the allowedGroups parameter of itsm/propose/main.bicep.
allowedGroups:
  - SG-SP-Projets
  - SG-VPN-Users
  - SG-App-Planning

# Dedicated Key Vault holding one-time secrets (temporary passwords / TAPs) written by the
# executor (itsm/execute) and revealed ONCE in the review tab to the validating agent, then deleted.
deliveryKeyVault: kv-ke3-itsm-delivery
