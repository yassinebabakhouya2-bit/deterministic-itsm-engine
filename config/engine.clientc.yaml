# =====================================================================
# Client configuration — Client C  (synthetic demo data)
# Embodies axiom A2 (client-agnosticism): all client specificity lives here.
# Adding a client = duplicate this file + a KB container + a clientId.
# The engine NEVER changes.
# =====================================================================

client:
  id: clientc                   # clientId — basis of multi-tenant isolation
  displayName: "Client C"
  language: fr

# Knowledge source (private Blob container dedicated to the client)
knowledge:
  storageContainer: kb-clientc
  index: idx-clientc            # DEDICATED index (physical isolation, J2)
  # audio: deferred to Milestone 3 (Azure Speech)

# Isolation (Jalon 5): tenant match (entraTenantId) always required; group
# match (entraGroup) required only when the tenant hosts several clients.
access:
  entraTenantId: "6cdc0a5a-779d-4912-a0b3-455e5fc4d9c6"   # Jalon 5 -- tenant shared by every client hosted here
  entraGroup: "TODO-group-clientc-objectId"   # to fill in via the portal (Milestone 2)

# Retrieval parameters (axiom A3 — hierarchy)
retrieval:
  primaryCount: 1               # one primary record
  annexCount: 2                 # + annexes (<= 2) before the LLM
  hybrid: true                  # BM25 + vectors
  semanticReranker: true

# Determinism (axiom A1)
generation:
  model: gpt-4o
  temperature: 0
  seed: 42
